<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#13202b" />
  <title>Options | {{ profile.name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='minecraft-portfolio.css') }}?v=20261120a" />
</head>
<body class="mc-portfolio">
<div class="mc-site">
  <header class="mc-topbar"><a class="mc-wordmark" href="{{ url_for('index') }}" aria-label="Home">KN</a><span class="mc-topbar-note">OPTIONS</span><a class="mc-quickview" href="{{ url_for('recruiter') }}">Recruiter Quick View</a></header>
  <main class="mc-page"><section class="mc-screen" aria-labelledby="options-title">
    <div class="mc-screen-heading"><span></span><h1 id="options-title">Options</h1><span></span></div>
    <p class="mc-screen-intro">Adjust how this portfolio menu looks and get in touch.</p>
    <div class="mc-options-grid">
      <div class="mc-option-row"><span class="mc-option-label">Reduce motion</span><input class="mc-pref-toggle" type="checkbox" data-preference="reduced-motion" aria-label="Reduce motion" /></div>
      <div class="mc-option-row"><span class="mc-option-label">High contrast</span><input class="mc-pref-toggle" type="checkbox" data-preference="high-contrast" aria-label="High contrast" /></div>
      <a class="mc-option-row mc-social-link" href="{{ url_for('about_page') }}"><span class="mc-option-label">Player Profile</span><span>Open</span></a>
      <a class="mc-option-row mc-social-link" href="mailto:{{ profile.email }}"><span class="mc-option-label">Contact</span><span>{{ profile.email }}</span></a>
    </div>
    <div class="mc-done-row"><a class="mc-done" href="{{ url_for('index') }}">Done</a></div>
  </section></main>
  <footer class="mc-footer"><span>{{ profile.name }} · Options</span><span>Portfolio · 2026</span></footer>
</div>
<script src="{{ url_for('static', filename='game-settings.js') }}"></script>
</body>
</html>
