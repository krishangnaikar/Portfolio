<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#17183a" />
  <title>Menu | Krishang Naikar</title>
  <link rel="stylesheet" href="static/game-ui.css" />
</head>
<body class="inner-page settings-page-body">
  <header><div class="game-header">
    <a class="brand-link" href="index.html"><span class="brand-mark" aria-hidden="true"></span>Krishang Naikar</a>
    <span class="header-mode">OPTIONS / MENU</span>
    <a class="header-recruiter" href="recruiter.html">RECRUITER QUICK VIEW <span aria-hidden="true">↗</span></a>
  </div></header>
  <main class="settings-page">
    <section class="settings-shell" aria-labelledby="settings-title">
      <div class="settings-titlebar"><span class="settings-rule" aria-hidden="true"></span><h1 id="settings-title">Menu</h1><a class="settings-close" href="index.html" aria-label="Close menu and return to lobby">×</a></div>
      <div class="settings-actions">
        <button type="button" class="settings-action" id="settings-toggle" aria-expanded="false" aria-controls="settings-preferences">Settings</button>
        <div class="settings-preferences" id="settings-preferences" hidden>
          <label class="settings-pref-row"><span>Reduce motion<small>Turn off interface movement and transitions.</small></span><input class="settings-switch" type="checkbox" data-preference="reduced-motion" aria-label="Reduce motion" /></label>
          <label class="settings-pref-row"><span>High contrast<small>Strengthen text and panel contrast.</small></span><input class="settings-switch" type="checkbox" data-preference="high-contrast" aria-label="High contrast" /></label>
        </div>
        <a class="settings-action" href="mailto:krishangnaikar7@gmail.com?subject=Portfolio%20inquiry">Player Support</a>
        <a class="settings-action" href="about.html">About</a>
        <a class="settings-action return-action" href="index.html">Return to Lobby</a>
      </div>
      <p class="settings-version">PORTFOLIO MENU // 01</p>
    </section>
  </main>
  <script src="static/game-settings.js"></script>
</body>
</html>
